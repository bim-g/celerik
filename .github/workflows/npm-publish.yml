name: Publish to npm

# Publishes a released version to npm again: Actions > Publish to npm > Run workflow,
# with the version (e.g. 0.7.0). For a release whose npm step failed (an expired token,
# or one that asks for a one-time password): the Release workflow stops when the tag
# exists, so it cannot be run again.
#
# The tag's commit holds the built bundle and package.json at the version: it is
# published as it is, nothing is built. npm access: trusted publishing (the repository
# variable NPM_TRUSTED_PUBLISHING set to true) or an NPM_TOKEN secret, as
# .github/scripts/npm-publish.sh says. The script is taken from main, so that a tag
# released before it can still be published.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version, without the "v" (e.g. 0.7.0)'
        required: true

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid version \"$VERSION\": use 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ inputs.version }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .ci
          sparse-checkout: .github/scripts

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check the package
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [[ "$version" != "$VERSION" ]]; then
            echo "::error::package.json at v$VERSION says $version"
            exit 1
          fi
          if [[ ! -f public/caelrik.js ]]; then
            echo "::error::v$VERSION has no built bundle (public/caelrik.js)"
            exit 1
          fi
          if npm view "$name@$VERSION" version > /dev/null 2>&1; then
            echo "::error::$name@$VERSION is already on npm"
            exit 1
          fi

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: bash .ci/.github/scripts/npm-publish.sh "$VERSION"
